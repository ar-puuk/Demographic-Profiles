# Single source of truth for the profiles pipeline. Nothing below is hardcoded in code.

# The state the profiles cover. To build another state, change these three values.
state:
  abbr: UT
  fips: "49"
  name: Utah

tiger:
  year: 2023        # vintage of the county, place and tract polygons

# Simplification tolerance (degrees) for the web boundary files, by geography type.
export:
  metric_crs: 26912          # UTM 12N (metres), used to shrink and measure the Rest of Utah remainder
  rest_margin_m: 2500        # the Rest of Utah point lies at least this far inside the remainder, clear of every area's edge
  simplify: { county: 0.0003, place: 0.0003, tract: 0.0003, state: 0.0010 }

# What the web app shows. Written to data/meta/app.json by the export step; the app has no state or organisation
# names of its own. defaults: the area opened for each geography type; benchmarks: larger areas offered first
# when comparing.
app:
  title: Utah Community Profiles
  organization: ""
  default_type: state
  defaults: { county: "49035", place: "4967000", state: "49" }
  benchmarks: ["49"]

qa:
  tolerance: 0.005             # allowed relative gap in the employment checks

acs:
  # 5-year end years. Counties, places and tracts go back to 2009.
  vintages: [2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  # Census geography -> the `for`/`in` clause used to pull the whole state at that level, and the first
  # vintage the API serves it for.
  geographies:
    state: { for: "state:{fips}", since: 2009 }
    county: { for: "county:*", in: "state:{fips}", since: 2009 }
    place: { for: "place:*", in: "state:{fips}", since: 2009 }
    tract: { for: "tract:*", in: "state:{fips} county:*", since: 2009 }
  # Whole tables are pulled (every estimate and margin of error). agg says how a table combines when
  # summing areas: sum (counts, the default) or median (never summed).
  tables:
    B01001: { topic: population, label: Sex by age }
    B01002: { topic: population, label: Median age, agg: median }
    B02001: { topic: population, label: Race }
    B03003: { topic: population, label: Hispanic or Latino origin }
    B26001: { topic: population, label: Group quarters population }
    B11012: { topic: households, label: Households by type }
    B25003: { topic: households, label: Tenure }
    B25044: { topic: households, label: Tenure by vehicles available }
    B25002: { topic: housing, label: Occupancy status }
    B25024: { topic: housing, label: Units in structure }
    B25034: { topic: housing, label: Year structure built }
    B25064: { topic: housing, label: Median gross rent, agg: median }
    B25077: { topic: housing, label: Median home value, agg: median }
    B25063: { topic: housing, label: Gross rent brackets }
    B25075: { topic: housing, label: Home value brackets }
    B25070: { topic: housing, label: Gross rent as a share of income }
    B25091: { topic: housing, label: Owner costs as a share of income }
    B19001: { topic: income, label: Household income brackets }
    B19013: { topic: income, label: Median household income, agg: median }
    B17001: { topic: income, label: Poverty status }
    B15003: { topic: education, label: Educational attainment }
    B14001: { topic: education, label: School enrollment }
    B23025: { topic: employment, label: Employment status }
    B08301: { topic: commute, label: Means of transportation to work (by residence) }
    B08303: { topic: commute, label: Travel time to work (by residence) }
    B08601: { topic: commute, label: Means of transportation to work (by workplace) }
    B08603: { topic: commute, label: Travel time to work (by workplace) }
    C16001: { topic: social, label: Language spoken at home }
    B18101: { topic: social, label: Disability status }
    B28002: { topic: social, label: Internet subscriptions }
    B03002: { topic: population, label: Hispanic or Latino origin by race }
    B05002: { topic: population, label: Place of birth by nativity }
    B07003: { topic: population, label: Residence one year ago }
    B25008: { topic: households, label: Population in occupied housing units }
    B25004: { topic: housing, label: Vacancy status }
    B27001: { topic: social, label: Health insurance coverage }
    B21001: { topic: population, label: Veteran status }
    B12001: { topic: population, label: Marital status }
    B25014: { topic: housing, label: Occupants per room (crowding) }
    B19313: { topic: income, label: Aggregate income }
    B19058: { topic: income, label: Public assistance or SNAP }
    B08013: { topic: commute, label: Aggregate travel time to work (by residence) }
    C24050: { topic: employment, label: Industry of employed residents }

# Population Estimates Program: annual population for the state, counties and places, from the Census
# bulk files. The 2010s series is based on the 2010 Census and the 2020s series on the 2020 Census, so
# the two are not strictly continuous across 2019/2020.
pep:
  base: https://www2.census.gov/programs-surveys/popest/datasets
  files:
    - { vintage: 2019, years: [2010, 2019], counties: 2010-2019/counties/totals/co-est2019-alldata.csv, places: "2010-2019/cities/totals/sub-est2019_{fips}.csv" }
    - { vintage: 2024, years: [2020, 2024], counties: 2020-2024/counties/totals/co-est2024-alldata.csv, places: "2020-2024/cities/totals/sub-est2024_{fips}.csv" }

# LEHD Origin-Destination Employment Statistics. LODES8 is tabulated on 2020 blocks for every year, so one
# crosswalk (the 2020 era) serves the whole series. WAC counts jobs by workplace block, RAC workers by
# residence block, OD jobs by residence-workplace pair. S000/JT00 is all workers and all job types.
lodes:
  base: https://lehd.ces.census.gov/data/lodes/LODES8
  years: [2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
  segment: S000
  job_type: JT00
  latest_only: [tract]       # tracts are published for the latest year only (maps); history stays in raw
  od_geographies: [county, place]
  other_id: other-ut         # OD id for a block of this state outside every area of a geography type
  drop_zero: [place, tract]  # these files omit rows of zero jobs (a missing row means zero)

# Quarterly Census of Employment and Wages (BLS): establishments, employment and wages by county,
# ownership and industry. The BLS area files start with 2014. agglvl 70 is the county total, 71 the
# total by ownership and 74 the NAICS sector by ownership. The state file uses the same levels as 50, 51 and 54.
qcew:
  base: https://data.bls.gov/cew/data/api
  years: [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  agglvl: [70, 71, 74]
  state_agglvl: [50, 51, 54]
  user_agent: Utah-Community-Profiles pipeline
