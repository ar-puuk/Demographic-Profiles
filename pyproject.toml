[project]
name = "APP-Community-Profiles"
version = "0.1.0"
description = "Utah community profiles: data pipeline and static map-first dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned: this is the version whose spatial extension loads under the Windows Application Control policy
    # on some Windows machines (1.5.6 and 2.0.0 binaries were blocked on the maintainer's machine). The maintainer may
    # test 2.0.0; bump deliberately and check that `LOAD spatial` works.
    "duckdb==1.5.4",
    "geopandas",  # only for pygris
    "pandas",
    "pyarrow",
    "pyproj",
    "pygris",
    "python-dotenv",
    "pyyaml",
    "requests",
    "shapely",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
profiles = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
ignore = ["ISC004"]  # implicit string concatenation is used deliberately in long SQL and help strings

[tool.uv]
link-mode = "copy"
